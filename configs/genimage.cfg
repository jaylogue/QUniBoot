// Genimage configuration file for QUniBoot
// 
// This file is used to generate the SD-card images for QuniBoot.
// 
// Two images are created: a "full" image, which contains a boot partition,
// a root filesystem and an app filesystem; and a "os-only" image which
// contains just the boot partition and the root filesystem. In both images,
// the layouts of the boot and rootfs partitions are identical, such that
// "os-only" image can be layered over top of an existing SD-card containing
// the full image as a means to upgrade the OS.
//

image boot.vfat {
	size = 15M
	vfat {
		label = "BOOT"
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"qunibone.dtbo",
			"autoconfig-example.txt",
			"extlinux"
		}
	}
}

image qunibone-full.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 15M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 16M
		size = 496M
	}

	partition appfs {
		partition-type = 0x83
		image = "appfs.ext4"
	}
}

image qunibone-os-only.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 15M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 16M
		size = 496M
	}
}

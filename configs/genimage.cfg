image boot.vfat {
	vfat {
		label = "QUNIBONE"
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"qunibone.dtbo",
			"extlinux"
		}
	}

	size = 16M
}

image qunibone-full.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 496M
	}

	partition appfs {
		partition-type = 0x83
		image = "appfs.ext4"
		size = 1G
	}
}

image qunibone-os-only.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 496M
	}

	partition appfs {
		partition-type = 0x83
		size = 1G
	}
}

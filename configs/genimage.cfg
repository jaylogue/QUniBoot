image boot.vfat {
	vfat {
		label = "QUNIBONE"
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"qunibone.dtbo",
			"extlinux"
		}
	}

	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 2048M
	}
}

image boot.vfat {
	size = 15M
	vfat {
		label = "<%QUNIBONE%>"
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"qunibone.dtbo",
			"extlinux"
		}
	}
}

image <%qunibone%>-full.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 15M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 16M
		size = 496M
	}

	partition appfs {
		partition-type = 0x83
		image = "appfs.ext4"
	}
}

image <%qunibone%>-os-only.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		size = 15M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 16M
		size = 496M
	}
}
